# PostgreSQL para o Separador de Materiais.
# Suba com:  docker compose up -d      (na pasta separador_materiais/)
# Os valores abaixo batem com os defaults do app (db.py) — não precisa de mais nada.
services:
  db:
    image: postgres:16
    container_name: separador_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: separador_materiais
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # dados persistem entre reinícios
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d separador_materiais"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
